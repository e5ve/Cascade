/* ---------- parser ---------- */
function parseOsu(t){
 const o={meta:{},diff:{},notes:[],bpm:0,bg:null,audio:'',mode:0};let sec='';
 for(let l of t.split(/\r?\n/)){l=l.trim();if(!l||l.startsWith('//'))continue;

   if(k=='AudioFilename')o.audio=v;else if(k=='Mode')o.mode=+v;else if(sec=='[Metadata]')o.meta[k]=v;else if(sec=='[Difficulty]')o.diff[k]=+v}
  else if(sec=='[Events]'){const m=l.match(/^0,0,"([^"]+)"/);if(m)o.bg=m[1]}

  else if(sec=='[HitObjects]')o.hit=(o.hit||[]).concat(l)}
 if(o.mode!==3)return null;
 const K=Math.round(o.diff.CircleSize||4);
 for(const l of o.hit||[]){const p=l.split(',');const x=+p[0],t=+p[2],ty=+p[3];
  const c=Math.max(0,Math.min(K-1,Math.floor(x*K/512)));
  o.notes.push({t,e:ty&128?+p[5].split(':')[0]:0,col:c})}
 o.notes.sort((a,b)=>a.t-b.t);
 return{ver:o.meta.Version||'?',keys:K,od:o.diff.OverallDifficulty??5,notes:o.notes,bpm:o.bpm,
  len:o.notes.length?Math.max(...o.notes.map(n=>n.e||n.t)):0,audio:o.audio,bg:o.bg,
  title:o.meta.Title||'Untitled',artist:o.meta.Artist||'',creator:o.meta.Creator||'',source:o.meta.Source||''};
}
async function importFiles(fs,nosave){

   for(const nm of names.filter(x=>/\.osu$/i.test(x))){const d=parseOsu(await z.files[nm].async('string'));d?diffs.push(d):skipped++}
   if(!diffs.length)continue;
   const d0=diffs[0],find=a=>names.find(x=>x.toLowerCase()==(a||'').toLowerCase());
   const an=find(d0.audio),bn=find(d0.bg);
   const abuf=an?await z.files[an].async('arraybuffer'):null;
   const bg=bn?URL.createObjectURL(await z.files[bn].async('blob')):null;
   addSet({title:d0.title,artist:d0.artist,creator:d0.creator,abuf,bg,diffs});n++;if(!nosave)dbPut(f);
  }else if(/\.(mp3|ogg|wav|flac|m4a)$/i.test(f.name)){const s={title:f.name.replace(/\.[^.]+$/,''),artist:'Imported audio',creator:'Auto-chart',abuf:await f.arrayBuffer(),bg:null,diffs:[]};addSet(s,true);s.fid=nosave?0:await dbPut(f);await autoChart(s);if(s.diffs.length)n++;else window.__keepMsg=1;}else if(/\.osu$/i.test(f.name)){
   const d=parseOsu(await f.text());if(!d){skipped++;continue}

   if(!s){s={title:d.title,artist:d.artist,creator:d.creator,abuf:null,bg:null,diffs:[]};addSet(s,true)}
   s.diffs.push(d);n++;if(!nosave)dbPut(f);
  }}catch(e){msg.textContent='Failed to read '+f.name+': '+e.message;return}}

}
function addSet(s,quiet){

function demo(){

  for(let i=0;i<220;i++){const t=2000+i*bl/spacing;if(t>62000)break;

   if(hold&&i%12==4)n.push({t,e:t+bl*1.5,col:c});else{n.push({t,e:0,col:c});if(i%8==0)n.push({t,e:0,col:(c+Math.ceil(K/2))%K})}}
  const ok=[];const last={};for(const x of n){if((last[x.col]??-1)<x.t){ok.push(x);last[x.col]=x.e||x.t+1}}return ok};

}

<script>
/* ============ Cascade chart recorder ============
   Play the song, tap your keys, and the notes get saved exactly where you pressed. */
(()=>{
const Q=s=>document.querySelector(s);
const HOLD_MS=300;
let savedMods=null,lastOpts=null;
try{lastOpts=JSON.parse(localStorage.getItem('cascade.edopts')||'null')}catch(e){}
const loadCh=()=>{try{return JSON.parse(localStorage.getItem(PK('charts'))||'{}')}catch(e){return{}}};
const saveCh=o=>{try{localStorage.setItem(PK('charts'),JSON.stringify(o))}catch(e){}};
const skey=s=>s.title+'|'+s.artist;
const customs=s=>s.diffs.filter(d=>d.custom);
const say=t=>{const m=Q('#msg');if(m)m.textContent=t};

/* re-attach saved charts to their songs whenever the list is drawn */
function attach(){const all=loadCh();for(const s of sets){const l=all[skey(s)];if(!l)continue;for(const c of l)if(!s.diffs.some(d=>d.cid==c.cid))s.diffs.push(c)}}
const _render=render;render=function(){attach();return _render.apply(this,arguments)};

/* ---------- dialog ---------- */
const ed=Q('#ed'),box=Q('#edbox');
const open=h=>{box.innerHTML=h;ed.classList.add('on')},close=()=>ed.classList.remove('on');

function recDialog(target){
 if(!cur){return}
 if(!(cur.buf||cur.abuf||cur.gen)){say('This song has no audio to record over. Import the full .osz or an audio file.');return}
 attach();
 const cs=customs(cur),o=Object.assign({keys:'asjk',speed:1,holds:true},lastOpts||{});
 open(`<h2>Record a chart</h2><div class="sub">${esc(cur.title)} — ${esc(cur.artist)}</div>
 <div class="f"><label>Chart name</label><input type="text" id="edn" maxlength="30" value="${esc(target?target.ver:'My Chart '+(cs.length+1))}"></div>
 <div class="f"><label>Keys</label><input type="text" id="edk" maxlength="10" value="${esc(o.keys)}" spellcheck="false" autocomplete="off"></div><div class="err" id="ede"></div>
 <div class="f"><label>Song speed</label><select id="eds"><option value="1">Normal (100%)</option><option value="0.75">Slow (75%) — easier to be precise</option></select></div>
 <div class="f"><label>Add to</label><select id="edt"><option value="">New chart</option>${cs.map(d=>`<option value="${d.cid}" ${target&&target.cid==d.cid?'selected':''}>Add notes to “${esc(d.ver)}”</option>`).join('')}</select></div>
 <div class="sub" style="margin:14px 0 0">Note size (live, applies to the whole game)</div>${szHTML()}
 <div class="f"><label></label><label class="tg"><input type="checkbox" id="edh" ${o.holds?'checked':''}> Holding a key for ${HOLD_MS/1000}s+ makes a long note</label></div>
 <div class="help">The song plays on its own. Press <b>your keys</b> where you want notes. Each press is saved at that exact moment. <b>Esc</b> pauses (Quit there saves), <b>Enter</b> finishes and saves. Adding to an existing chart shows its notes faded so you can fill gaps.</div>
 ${cs.length?`<div class="sub" style="margin:10px 0 2px">Your charts on this song</div>${cs.map(d=>`<div class="ch"><span>${esc(d.ver)} · ${d.keys}K · ${d.notes.length} notes</span><button data-del="${d.cid}">Delete</button></div>`).join('')}`:''}
 <div class="btns"><button id="edx">Cancel</button><button class="rec" id="edgo">● Start recording</button></div>`);
 Q('#eds').value=String(o.speed);szBind(box);
 Q('#edx').onclick=close;
 box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del;cur.diffs=cur.diffs.filter(d=>d.cid!=id);const all=loadCh();if(all[skey(cur)])all[skey(cur)]=all[skey(cur)].filter(c=>c.cid!=id);saveCh(all);curD=0;render();recDialog()});
 const kin=Q('#edk'),err=Q('#ede');
 kin.oninput=()=>{err.textContent=''};
 Q('#edgo').onclick=()=>{
  const k=kin.value.toLowerCase();
  if(k.length<1||k.length>10){err.textContent='Use between 1 and 10 keys.';return}
  if(new Set(k).size!=k.length){err.textContent='Each key can only be used once.';return}
  const tid=Q('#edt').value,tg=tid?cs.find(d=>d.cid==tid):null;
  if(tg&&tg.keys!=k.length){err.textContent=`That chart has ${tg.keys} keys — enter ${tg.keys} keys to add to it.`;return}
  const opts={keys:k,speed:+Q('#eds').value,holds:Q('#edh').checked,name:Q('#edn').value.trim()||'My Chart',target:tg};
  lastOpts={keys:k,speed:opts.speed,holds:opts.holds};try{localStorage.setItem('cascade.edopts',JSON.stringify(lastOpts))}catch(e){}
  close();begin(opts)}
 setTimeout(()=>Q('#edn').select(),30);
}


/* ---------- note size sliders (dialog + pause menu) ---------- */
const SZ=[['Note height','nh',.15,.8,.01,v=>Math.round(v*100)+'%'],['Note width','nw',.5,1,.01,v=>Math.round(v*100)+'%'],['Column width','cw',30,200,1,v=>v+'px']];
const szHTML=()=>SZ.map(([l,k,a,b,st,f])=>`<div class="f"><label>${l}</label><input type="range" min="${a}" max="${b}" step="${st}" value="${S.cfg[k]}" data-sz="${k}" style="flex:1"><b data-szv="${k}" style="min-width:42px;text-align:right">${f(S.cfg[k])}</b></div>`).join('');
function szBind(root){root.querySelectorAll('[data-sz]').forEach(i=>i.oninput=()=>{const k=i.dataset.sz,r=SZ.find(x=>x[1]==k);S.cfg[k]=+i.value;save();root.querySelector(`[data-szv="${k}"]`).textContent=r[5](+i.value)})}
const _pzd=pzDraw;
pzDraw=function(){_pzd.apply(this,arguments);const pr=Q('#pz .pr');if(!pr)return;
 const d=document.createElement('div');d.className='cd';d.innerHTML=`<h4>Note size</h4>${szHTML().replace(/class="f"/g,'class="row"').replace(/<label>/g,'<label>')}`;
 pr.insertBefore(d,pr.children[1]||null);szBind(d)};


/* ---------- put note size in Settings > Notes ---------- */
try{const nc=CATS.find(c=>c[0]=='Notes');if(nc&&Array.isArray(nc[2])){
 for(const grp of nc[2])grp[1]=grp[1].filter(r=>r[1]!='nh'&&r[1]!='nw'&&r[1]!='cw');

}}catch(e){}

/* ---------- start a recording take ---------- */
async function begin(o){
 await AC.resume();

 if(!buf){say('Audio could not be decoded.');return}
 const K=o.keys.length;S.binds[K]=o.keys;save();            /* so the finished chart plays with the same keys */

 savedMods=Object.assign({},mods);mods={};if(o.speed<1)mods.ht=true;
 await start(d);

}

/* ---------- capture keys during a take ---------- */
const isRec=()=>g&&g.d&&g.d.rec;
const kstr=()=>g.d.opts.keys;
const R=()=>g.rec||(g.rec=[]);
function endHolds(){if(!g||!g.cur)return;const tm=now();for(let c=0;c<g.K;c++){const n=g.cur[c];if(!n)continue;g.cur[c]=null;if(g.d.opts.holds&&tm-n._dn>HOLD_MS)n.e=Math.max(n.t+1,Math.round(Math.min(tm,g.d.len)))}}
addEventListener('keydown',e=>{
 if(!isRec()||g.paused||g.rs||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key=='Enter'){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)finish();return}
 const c=kstr().indexOf(e.key.toLowerCase());if(c<0||e.key.length>1&&e.key!=' ')return;
 e.preventDefault();e.stopImmediatePropagation();
 if(e.repeat||g.down[c])return;
 g.down[c]=true;g.flash[c]=performance.now();lastCol=c;click();burst(c,0);
 const t=now();if(t<0)return;
 const arr=R(),last=arr.filter(n=>n.col==c).pop();
 if(last&&(last.e===null||(last.e||last.t)+30>t))return;
 const n={t:Math.round(t),e:0,col:c,_dn:t};arr.push(n);(g.cur||(g.cur=[]))[c]=n;
},true);
addEventListener('keyup',e=>{
 if(!isRec()||g.paused)return;
 const c=kstr().indexOf(e.key.toLowerCase());if(c<0||e.key.length>1&&e.key!=' ')return;
 e.stopImmediatePropagation();g.down[c]=false;
 const n=g.cur&&g.cur[c];if(n){g.cur[c]=null;const tm=now();if(g.d.opts.holds&&tm-n._dn>HOLD_MS)n.e=Math.max(n.t+1,Math.round(tm))}
},true);
const _sc=score;score=function(){return isRec()?0:_sc.apply(this,arguments)};
const _pp=pzPause;pzPause=function(){if(isRec())endHolds();return _pp.apply(this,arguments)};

/* ---------- recording overlay (trail of placed notes, ghosts, REC badge) ---------- */
const _draw=draw;
draw=function(t){
 const rec=isRec(),c=S.cfg,u=devicePixelRatio;
 cx.clearRect(0,0,cv.width,cv.height);

<script>
/* ===== export levels: .osz (song + every chart) and single charts (.osu); re-import with the normal Import button or by dropping the file ===== */
(()=>{
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
const enc=new TextEncoder();
function zip(files){/* stored (uncompressed) zip: fast and fine for already-compressed audio */
 const parts=[],cen=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),d=f.data,cr=crc(d),h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
  h.setUint32(14,cr,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
  parts.push(h.buffer,nm,d);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
  c.setUint32(16,cr,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cen.push(c.buffer,nm);off+=30+nm.length+d.length}
 let cl=0;for(const x of cen)cl+=x.byteLength;
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}
const clean=v=>String(v==null?'':v).replace(/[\r\n]+/g,' ').trim();
const fname=v=>clean(v).replace(/[\\/:*?"<>|]+/g,'_').replace(/^\.+/,'').slice(0,90)||'untitled';
function sniffAudio(u){const a=String.fromCharCode(...u.subarray(0,4)),b=String.fromCharCode(...u.subarray(8,12)),c=String.fromCharCode(...u.subarray(4,8));
 if(a=='OggS')return'ogg';if(a=='fLaC')return'flac';if(a=='RIFF'&&b=='WAVE')return'wav';if(c=='ftyp')return'm4a';return'mp3'}
function sniffImg(u){return u[0]==0x89&&u[1]==0x50?'png':'jpg'}
function osuText(s,d,audio,bg){
 const K=d.keys,L=['osu file format v14','','[General]','AudioFilename: '+audio,'AudioLeadIn: 0','PreviewTime: -1','Countdown: 0','SampleSet: Soft','StackLeniency: 0.7','Mode: 3','LetterboxInBreaks: 0','SpecialStyle: 0','WidescreenStoryboard: 0','',
 '[Editor]','DistanceSpacing: 1','BeatDivisor: 4','GridSize: 4','TimelineZoom: 1','',
 '[Metadata]','Title:'+clean(s.title),'TitleUnicode:'+clean(s.title),'Artist:'+clean(s.artist),'ArtistUnicode:'+clean(s.artist),'Creator:'+clean(s.creator),'Version:'+clean(d.ver),'Source:'+clean(d.source||''),'Tags:cascade','BeatmapID:0','BeatmapSetID:-1','',
 '[Difficulty]','HPDrainRate:5','CircleSize:'+K,'OverallDifficulty:'+(d.od??5),'ApproachRate:5','SliderMultiplier:1.4','SliderTickRate:1','',
 '[Events]','//Background and Video events'];
 if(bg)L.push('0,0,"'+bg+'",0,0');
 L.push('','[TimingPoints]');if(d.bpm>0)L.push('0,'+(60000/d.bpm).toFixed(6)+',4,2,0,50,1,0');
 L.push('','[HitObjects]');
 for(const n of d.notes){const t=Math.round(n.t),x=Math.floor((n.col+.5)*512/K);
  L.push(n.e&&n.e>n.t?`${x},192,${t},128,0,${Math.round(n.e)}:0:0:0:0:`:`${x},192,${t},1,0,0:0:0:0:`)}
 return L.join('\r\n')+'\r\n'}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
let tt;function toast(m){let e=document.getElementById('xtoast');if(!e){e=document.createElement('div');e.id='xtoast';document.body.appendChild(e)}e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3800)}
const base=s=>fname((s.artist&&s.artist!='Imported audio'?s.artist+' - ':'')+s.title);
async function exportSet(s){
 try{
  if(!s||!s.diffs.length){toast('Nothing to export yet.');return}
  const files=[];let an=null,bn=null,note='';
  if(s.abuf){const u=new Uint8Array(s.abuf);an='audio.'+sniffAudio(u);files.push({name:an,data:u})}else note=' (this song has no audio file, so only the charts were exported)';
  if(s.bg){try{const u=new Uint8Array(await(await(await fetch(s.bg)).blob()).arrayBuffer());bn='bg.'+sniffImg(u);files.push({name:bn,data:u})}catch(e){}}
  const used=new Set();
  for(const d of s.diffs){let nm=fname(`${s.artist} - ${s.title} (${s.creator}) [${d.ver}]`)+'.osu',i=2;while(used.has(nm))nm=nm.replace(/(\.osu)$/,' '+(i++)+'$1');used.add(nm);
   files.push({name:nm,data:enc.encode(osuText(s,d,an||'',bn))})}
  save(zip(files),base(s)+'.osz');toast(`Exported ${s.diffs.length} chart${s.diffs.length>1?'s':''} as .osz${note}`)
 }catch(e){toast('Export failed: '+e.message)}}
function exportChart(s,d){
 try{let an='',bn='';if(s.abuf)an='audio.'+sniffAudio(new Uint8Array(s.abuf,0,12));
  save(new Blob([osuText(s,d,an,'')],{type:'text/plain'}),fname(`${s.artist} - ${s.title} (${s.creator}) [${d.ver}]`)+'.osu');toast('Exported chart as .osu (import it onto a song with the same title and artist)')}catch(e){toast('Export failed: '+e.message)}}
window.cascadeExport={exportSet,exportChart,zip,osuText};
/* add the buttons to the song panel */
const _di=drawInfo;
drawInfo=function(){_di.apply(this,arguments);
 const I=document.getElementById('info');if(!I||!cur||!cur.diffs.length||I.querySelector('.xrow'))return;
 const host=I.querySelector('.zbody')||I,r=document.createElement('div');r.className='xrow';
 r.innerHTML="<button class='zbtn' id='xset' title='Song, background and every chart in one .osz file'>Export level (.osz)</button><button class='zbtn' id='xch' title='Just the selected chart'>Export this chart (.osu)</button>";
 host.appendChild(r);
 r.querySelector('#xset').onclick=()=>exportSet(cur);
 r.querySelector('#xch').onclick=()=>exportChart(cur,cur.diffs[Math.min(curD,cur.diffs.length-1)])};
try{if(typeof render=='function'&&scr=='sel')render()}catch(e){}
})();
